name: Build EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dearpygui keyboard pywinauto comtypes requests pyperclip pyautogui dbcpy pyinstaller
          # 如果有 requirements.txt 就加上：
          # pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller WoTLK_MultiTool.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoTLK_MultiTool-windows
          path: dist/WoTLK_MultiTool.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WoTLK_MultiTool.exe

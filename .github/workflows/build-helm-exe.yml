name: Build Helm Offset Tool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dearpygui pywinauto comtypes requests pyperclip pyinstaller

      - name: Build EXE
        run: pyinstaller helm_tool.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelmOffsetTool-windows
          path: dist/HelmOffsetTool.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HelmOffsetTool.exe
